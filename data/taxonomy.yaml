# probe — competency taxonomy v1
#
# 50 nodes across two role families (backend engineering, data/ML). The rubric
# compiler maps job-description and resume text ONTO these ids; it never
# invents one. Stable ids are what make item parameters reusable across
# candidates and results comparable across runs.
#
# `concepts` is the load-bearing field. It is simultaneously:
#   * the vocabulary rubric anchors are written in ("names quorum reads"),
#     which is how content is separated from style; and
#   * the channel through which a simulated candidate's hidden ability becomes
#     observable — a stronger candidate names more of these, and the grader
#     recovers ability by reading the answer, never by consulting theta*.
#
# Ordering within `concepts` matters: earlier entries are the ones a merely
# competent answer reaches for, later ones separate strong from excellent.

